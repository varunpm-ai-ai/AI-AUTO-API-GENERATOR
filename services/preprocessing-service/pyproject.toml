[project]
name = "preprocessing-service"
version = "1.0.0"
description = "Dataset Preprocessing Microservice for AI Auto API Generator"
authors = [{ name = "AI Auto API Generator Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.0.0",
    "aio-pika>=9.4.1",
    "aiokafka>=0.10.0",
    "redis>=5.0.3",
    "minio>=7.2.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
